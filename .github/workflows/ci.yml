name: Scientific CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.12'
          - os: windows-latest
            python: '3.12'
          - os: ubuntu-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.12.7
      - run: uv sync --locked --extra dev --python ${{ matrix.python }}
      - run: uv run --locked ruff check src tests scripts
      - run: uv run --locked ruff format --check src tests scripts
      - run: uv run --locked mypy
      - run: uv run --locked pytest -q
      - run: uv run --locked gbflex validate --suite smoke
      - run: uv run --locked gbflex demo run --hours 24 --seeds 11,22 --output runs/ci-demo
      - run: uv run --locked gbflex verify --run runs/ci-demo
